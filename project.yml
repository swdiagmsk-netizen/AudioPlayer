# Описание проекта для XcodeGen: из него в CI создаётся AudioPlayer.xcodeproj
name: AudioPlayer

options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  AudioPlayer:
    type: application
    platform: iOS
    sources:
      - path: AudioPlayer
    info:
      path: AudioPlayer/Info.plist
      properties:
        CFBundleDisplayName: PlayMyDisk
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        # Языки интерфейса (переводы — в Resources/<язык>.lproj)
        CFBundleLocalizations:
          - en
          - ru
          - zh-Hant
          - ja
          - es
          - de
          - fr
          - pt
          - hi
          - ar
          - bn
          - id
        UIBackgroundModes:
          - audio
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: Доступ к локальной сети нужен, чтобы принимать музыку с компьютера по Wi-Fi.
        NSMicrophoneUsageDescription: Микрофон нужен, чтобы распознать песню, которая звучит рядом.
        LSApplicationQueriesSchemes:
          - shazam
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Приложение предлагается в «Открыть в…» для аудиофайлов
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.audio
              - public.mp3
              - public.mpeg-4-audio
              - com.apple.m4a-audio
              - com.microsoft.waveform-audio
              - public.aiff-audio
              - public.aifc-audio
              - com.apple.coreaudio-format
              - org.xiph.flac
              - com.audible.aa
              - com.audible.aax
        # Форматы Audible, для которых нет системного типа
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.audible.aa
            UTTypeDescription: Audible Audiobook
            UTTypeConformsTo:
              - public.audio
            UTTypeTagSpecification:
              public.filename-extension:
                - aa
          - UTTypeIdentifier: com.audible.aax
            UTTypeDescription: Audible Enhanced Audiobook
            UTTypeConformsTo:
              - public.audio
            UTTypeTagSpecification:
              public.filename-extension:
                - aax
    dependencies:
      - target: PlayMyDiskWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.audioplayer
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # Кнопка «Распознать» для экрана блокировки и Пункта управления (WidgetKit ControlWidget)
  PlayMyDiskWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: PlayMyDiskWidget
      - path: AudioPlayer/Shared/RecognizeSongIntent.swift
    info:
      path: PlayMyDiskWidget/Info.plist
      properties:
        CFBundleDisplayName: PlayMyDisk
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.audioplayer.widget
        GENERATE_INFOPLIST_FILE: "NO"
        SKIP_INSTALL: "YES"

  AudioPlayerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AudioPlayerTests
    dependencies:
      - target: AudioPlayer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.local.audioplayer.tests

schemes:
  AudioPlayer:
    build:
      targets:
        AudioPlayer: all
    test:
      targets:
        - AudioPlayerTests
    archive:
      config: Release
